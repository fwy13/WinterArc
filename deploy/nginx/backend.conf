# Colyseus HTTP matchmaking, account API and WebSocket share this upstream.
# Docker's embedded DNS also resolves a recreated server container's new IP.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend server:2567;
location / {
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, don't trust an arbitrary client-supplied X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}
