name: winterarc
services:
  server:
    image: winterarc-server:${SERVER_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/server.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "2567"
      ACCOUNT_DB_PATH: /data/accounts.sqlite
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      FUND_BANK_API_URL: ${FUND_BANK_API_URL:-}
      FUND_BANK_API_TOKEN: ${FUND_BANK_API_TOKEN:-}
      FUND_BANK_ACCOUNT: ${FUND_BANK_ACCOUNT:-}
      FUND_BANK_KEYWORD: ${FUND_BANK_KEYWORD:-WinterArc}
    volumes:
      - accounts:/data
    expose:
      - "2567"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      NGINX_ENVSUBST_FILTER: ^API_DOMAIN$
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/http.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/backend.conf:/etc/nginx/snippets/backend.conf:ro
      - acme:/var/www/certbot:ro
      - certificates:/etc/letsencrypt:ro
    logging: *logs
  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - acme:/var/www/certbot
      - certificates:/etc/letsencrypt
volumes:
  accounts:
  acme:
  certificates:
